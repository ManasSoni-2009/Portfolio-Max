<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;display=swap');

      .bg { fill: #02040a; }
      .text-title {
        font-family: 'Syncopate', sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 6px;
      }

      .line {
        stroke: #0ea5e9;
        stroke-width: 2;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawLine 3s forwards;
      }

      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }

      .wave {
        fill: none;
        stroke: #0ea5e9;
        stroke-width: 2;
        opacity: 0.5;
        animation: ripple 2s linear infinite;
        transform-origin: 700px 65px;
      }

      @keyframes ripple {
        0% { transform: scale(0.5); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="150" />

  <line x1="50" y1="110" x2="750" y2="110" class="line" />
  <line x1="50" y1="110" x2="750" y2="110" stroke="#0ea5e9" stroke-width="2" style="filter:blur(8px); opacity:0.5;" />

  <text x="50" y="80" class="text-title">CONTACT</text>

  <circle cx="700" cy="65" r="10" fill="#0ea5e9" />
  <circle cx="700" cy="65" r="15" class="wave" />
  <circle cx="700" cy="65" r="25" class="wave" style="animation-delay: 1s;" />

</svg>