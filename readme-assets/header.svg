<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&amp;family=Space+Grotesk:wght@300;600&amp;display=swap');

      .bg { fill: #02040a; }
      .text-title {
        font-family: 'Syncopate', sans-serif;
        font-size: 64px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        letter-spacing: 4px;
      }
      .text-subtitle {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        font-weight: 300;
        fill: #8b949e;
        text-anchor: middle;
        letter-spacing: 8px;
        animation: fade 3s infinite alternate;
      }

      .glow-blue { fill: #3b82f6; filter: blur(60px); opacity: 0.5; animation: pulseBlue 6s infinite alternate; }
      .glow-purple { fill: #8b5cf6; filter: blur(60px); opacity: 0.5; animation: pulsePurple 7s infinite alternate; }

      .grid-line { stroke: rgba(255,255,255,0.03); stroke-width: 1; }

      @keyframes pulseBlue {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.5) translate(-20px, 20px); opacity: 0.6; }
      }
      @keyframes pulsePurple {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.3) translate(20px, -20px); opacity: 0.5; }
      }
      @keyframes fade {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }

      .orb {
        fill: none;
        stroke: url(#grad);
        stroke-width: 1;
        animation: rotate 20s linear infinite;
        transform-origin: 400px 150px;
      }

      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect class="bg" width="800" height="300" />

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" class="grid-line" />
  </pattern>
  <rect width="800" height="300" fill="url(#grid)" />

  <circle cx="200" cy="150" r="100" class="glow-blue" />
  <circle cx="600" cy="150" r="100" class="glow-purple" />

  <circle cx="400" cy="150" r="180" class="orb" stroke-dasharray="2 10" />
  <circle cx="400" cy="150" r="160" class="orb" stroke-dasharray="10 20" style="animation-direction: reverse; animation-duration: 30s;" />

  <text x="400" y="155" class="text-title">MANAS SONI</text>
  <text x="400" y="195" class="text-subtitle">3D INTERACTIVE PORTFOLIO</text>

</svg>